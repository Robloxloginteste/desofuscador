<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desofuscador de Script</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
            padding: 10px;
            font-size: 16px;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output {
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Desofuscador de Script</h1>
        <p>Este desofuscador tenta desofuscar qualquer script obfuscado usando métodos avançados.</p>
        <textarea id="inputScript" placeholder="Cole o script obfuscado aqui..."></textarea>
        <button onclick="desofuscarScript()">Desofuscar</button>
        <div class="output" id="outputScript"></div>
    </div>

    <script>
        function desofuscarScript() {
            const inputScript = document.getElementById('inputScript').value;
            let desofuscatedScript = '';

            console.log('Script de entrada:', inputScript);

            try {
                // Tentar desofuscar usando base64
                desofuscatedScript = desofuscarBase64(inputScript);
                if (desofuscatedScript) {
                    console.log('Desofuscado com sucesso usando base64');
                    document.getElementById('outputScript').textContent = desofuscatedScript;
                    return;
                }

                // Tentar desofuscar usando método avançado
                desofuscatedScript = desofuscarHacker(inputScript);
                if (desofuscatedScript) {
                    console.log('Desofuscado com sucesso usando método avançado');
                    document.getElementById('outputScript').textContent = desofuscatedScript;
                    return;
                }

                desofuscatedScript = 'O script não foi desofuscado com sucesso.';
            } catch (error) {
                desofuscatedScript = `Erro ao desofuscar o script: ${error.message}`;
                console.error('Erro ao desofuscar o script:', error);
            }

            document.getElementById('outputScript').textContent = desofuscatedScript;
        }

        function desofuscarBase64(script) {
            try {
                // Tentar decodificar base64
                const decodedScript = atob(script);
                console.log('Script decodificado de base64:', decodedScript);
                return decodedScript;
            } catch (error) {
                console.log('Script não é base64');
                return null;
            }
        }

        function desofuscarHacker(script) {
            // Método avançado de desofuscação
            let desofuscated = script;

            // Remover comentários
            desofuscated = desofuscated.replace(/\/\/.*|\/\*[\s\S]*?\*\/|(\b(?:console|debugger)\b)\(.*?\)/g, '');

            // Tentar desofuscar variáveis renomeadas
            desofuscated = desofuscated.replace(/[\w$]+/g, (match) => {
                if (match.length === 1) {
                    return match;
                }
                return '_';
            });

            // Remover espaços em branco desnecessários
            desofuscated = desofuscated.replace(/\s+/g, ' ').trim();

            console.log('Script desofuscado com método avançado:', desofuscated);
            return desofuscated;
        }
    </script>
</body>
</html>
