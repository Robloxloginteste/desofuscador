<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desofuscador de Script</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
            padding: 10px;
            font-size: 16px;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output {
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Desofuscador de Script</h1>
        <p>Este desofuscador suporta apenas scripts obfuscados por Wearedevs, MoonSec, Lua Obfuscator e Obfuscator.</p>
        <textarea id="inputScript" placeholder="Cole o script obfuscado aqui..."></textarea>
        <button onclick="desofuscarScript()">Desofuscar</button>
        <div class="output" id="outputScript"></div>
    </div>

    <script>
        function desofuscarScript() {
            const inputScript = document.getElementById('inputScript').value;
            let desofuscatedScript = '';

            console.log('Script de entrada:', inputScript);

            try {
                // Identificar o tipo de obfuscação
                if (inputScript.includes('Wearedevs')) {
                    desofuscatedScript = desofuscarWearedevs(inputScript);
                } else if (inputScript.includes('MoonSec')) {
                    desofuscatedScript = desofuscarMoonSec(inputScript);
                } else if (inputScript.includes('Lua Obfuscator')) {
                    desofuscatedScript = desofuscarLuaObfuscator(inputScript);
                } else if (inputScript.includes('Obfuscator')) {
                    desofuscatedScript = desofuscarObfuscator(inputScript);
                } else {
                    desofuscatedScript = 'O script não pertence a nenhum dos tipos suportados (Wearedevs, MoonSec, Lua Obfuscator, Obfuscator).';
                }
            } catch (error) {
                desofuscatedScript = `Erro ao desofuscar o script: ${error.message}`;
                console.error('Erro ao desofuscar o script:', error);
            }

            document.getElementById('outputScript').textContent = desofuscatedScript;
        }

        function desofuscarWearedevs(script) {
            // Lógica de desofuscação específica para Wearedevs
            // Exemplo simples de desofuscação (substituir caracteres)
            const map = {
                'a': 'b',
                'b': 'c',
                'c': 'd',
                // Adicione mais mapeamentos conforme necessário
            };

            let desofuscated = '';
            for (let char of script) {
                desofuscated += map[char] || char;
            }

            console.log('Script desofuscado com mapeamento de caracteres para Wearedevs:', desofuscated);
            return desofuscated;
        }

        function desofuscarMoonSec(script) {
            // Lógica de desofuscação específica para MoonSec
            // Exemplo simples de desofuscação (substituir caracteres)

                // Adicione mais mapeamentos conforme necessário
            };

            }

            console.log('Script desofuscado com mapeamento de caracteres para MoonSec:', desofuscated);
            return desofuscated;
        }

        function desofuscarLuaObfuscator(script) {

            // Exemplo simples de desofuscação (substituir caracteres)
            const map = {
                'a': 'b',

                'c': 'd',
                // Adicione mais mapeamentos conforme necessário
            };

            let desofuscated = '';

                desofuscated += map[char] || char;
            }

            console.log('Script desofuscado com mapeamento de caracteres para Lua Obfuscator:', desofuscated);
            return desofuscated;
        }

        function desofuscarObfuscator(script) {
            // Lógica de desofuscação específica para Obfuscator
            // Exemplo simples de desofuscação (substituir caracteres)
            const map = {

                desofuscated += map[char] || char;
            }

            console.log('Script desofuscado com mapeamento de caracteres para Obfuscator:', desofuscated);
            return desofuscated;
        }
    </script>
</body>
</html>
