<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desofuscador de Script</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
            padding: 10px;
            font-size: 16px;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output {
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Desofuscador de Script</h1>
        <textarea id="inputScript" placeholder="Cole o script obfuscado aqui..."></textarea>
        <button onclick="desofuscarScript()">Desofuscar</button>
        <div class="output" id="outputScript"></div>
    </div>

    <script>
        function desofuscarScript() {
            const inputScript = document.getElementById('inputScript').value;
            let desofuscatedScript = '';

            try {
                // Tentar desofuscar usando base64
                desofuscatedScript = desofuscarBase64(inputScript);
                if (desofuscatedScript) {
                    document.getElementById('outputScript').textContent = desofuscatedScript;
                    return;
                }

                // Se não for base64, tentar desofuscar usando mapeamento de caracteres
                desofuscatedScript = desofuscarJavaScriptObfuscator(inputScript);
            } catch (error) {
                desofuscatedScript = `Erro ao desofuscar o script: ${error.message}`;
            }

            document.getElementById('outputScript').textContent = desofuscatedScript;
        }

        function desofuscarBase64(script) {
            try {
                // Tentar decodificar base64
                const decodedScript = atob(script);
                return decodedScript;
            } catch (error) {
                return null;
            }
        }

        function desofuscarJavaScriptObfuscator(script) {
            // Lógica de desofuscação específica para JavaScript Obfuscator
            // Exemplo simples de desofuscação (substituir caracteres)
            const map = {
                'a': 'b',
                'b': 'c',
                'c': 'd',
                // Adicione mais mapeamentos conforme necessário
            };

            let desofuscated = '';
            for (let char of script) {
                desofuscated += map[char] || char;
            }

            return desofuscated;
        }
    </script>
</body>
</html>
